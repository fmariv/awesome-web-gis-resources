name: Check README links

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--no-progress --verbose README.md'
          fail: false
          jobSummary: true
